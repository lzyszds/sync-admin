name: Notify Telegram

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      title:
        description: "通知标题"
        required: false
        default: "云控后台 · 手动触发"
      body:
        description: "通知正文"
        required: false
        default: ""

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send Telegram notification
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          chmod +x scripts/notify-tg.sh
          TITLE="${{ github.event.inputs.title || '代码已推送到 main' }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            TITLE="✅ 云控后台已推送"
            BODY="$(git log -1 --pretty=format:'%h %s%n%n作者: %an <%ae>%n时间: %ad' --date=format:'%Y-%m-%d %H:%M:%S')%n%n仓库: ${{ github.repository }}%n链接: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          else
            BODY="${{ github.event.inputs.body }}"
          fi
          ./scripts/notify-tg.sh "$TITLE" "$BODY" || echo "::warning::Telegram 通知发送失败"

      - name: Check Telegram delivery
        if: always()
        run: |
          echo "通知流程结束（失败不会阻塞提交）"
